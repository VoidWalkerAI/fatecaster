name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Run FateCaster tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build FateCaster debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload FateCaster debug APK
        uses: actions/upload-artifact@v7
        with:
          name: FateCaster-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Build FateCaster release AAB
        run: gradle :app:bundleRelease --stacktrace

      - name: Upload FateCaster release AAB
        uses: actions/upload-artifact@v7
        with:
          name: FateCaster-release-aab-unsigned
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
